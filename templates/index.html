<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools - Free</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 20px; }
        h1 { color: #333; font-size: 32px; }
        p { color: #666; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card {
            background: white; border: 2px dashed #ccc; border-radius: 10px;
            padding: 30px; width: 350px; text-align: center;
        }
        .card:hover { border-color: #e5322d; }
        button {
            background: #e5322d; color: white; border: none; padding: 12px 25px;
            font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px;
        }
        button:hover { background: #c02722; }
        input[type="text"] { padding: 10px; width: 80%; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Free PDF Tools</h1>
    <p>Apni PDF files ko convert karein ya edit karein bilkul free!</p>
    
    <div class="container">
        <!-- Feature 1: PDF to Word -->
        <div class="card">
            <h3>📄 PDF to Word Converter</h3>
            <p>PDF file ko Word (DOCX) mein badlein.</p>
            <form action="/convert" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" accept=".pdf" required>
                <br>
                <button type="submit">Convert to Word</button>
            </form>
        </div>

        <!-- Feature 2: PDF Editor (Text Add) -->
        <div class="card">
            <h3>✍️ Add Text/Sign to PDF</h3>
            <p>PDF ke pehle page par apna naam ya text add karein.</p>
            <form action="/edit-pdf" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" accept=".pdf" required>
                <br>
                <input type="text" name="text_to_add" placeholder="Yahan text likhein (jaise: Signed by Rahul)" required>
                <br>
                <button type="submit">Add Text & Download PDF</button>
            </form>
        </div>
    </div>
</body>
</html>
